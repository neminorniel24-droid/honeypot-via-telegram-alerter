services:
  redis:
    image: redis:7-alpine
    networks: [internal]
    restart: unless-stopped

  honeypot:
    build: ./honeypot
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks: [internal]
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      - REDIS_HOST=redis
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    depends_on:
      - redis
    networks: [internal]
    restart: unless-stopped

  juiceshop:
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
